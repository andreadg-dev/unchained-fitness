<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workout Session Player</title>

    <!-- Demo dependencies. Remove duplicates if already included in your app. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>


<style>

        :root {
            --app-bg: #0b1220;
            --panel: rgba(18, 25, 37, 0.94);
            --panel-raised: #192231;
            --panel-hover: #202b3b;

            --border: rgba(148, 163, 184, 0.14);
            --border-hover: rgba(148, 163, 184, 0.28);

            --text: #e5eaf1;
            --text-secondary: #a0acbc;
            --text-muted: #778498;

            --accent: #6ee7b7;
            --accent-hover: #8af0c8;
            --accent-dark: #153b31;

            --danger: #f28b8b;
            --danger-bg: rgba(242, 139, 139, 0.10);

            --radius: 16px;
            --radius-small: 10px;

            --content-width: 1100px;

            --main-font-family:
                Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
            --main-font-size: 14px;
            --main-font-color: var(--text);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(110, 231, 183, 0.09),
                    transparent 45%
                ),
                linear-gradient(180deg, #0b1220 0%, #101827 100%);
            background-color: var(--app-bg);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--main-font-color);
            font-family: var(--main-font-family);
            font-size: var(--main-font-size);
            line-height: 1.5;
            background: transparent;
        }

/* =========================================================
   1. PLAYER DESIGN TOKENS
========================================================= */

:root {
    --player-bg: rgba(18, 25, 37, 0.94);
    --player-raised: #192231;
    --player-border: rgba(148, 163, 184, 0.14);

    --player-text: #e5eaf1;
    --player-secondary: #a0acbc;
    --player-muted: #778498;

    --player-accent: #6ee7b7;
    --player-accent-hover: #8af0c8;

    --player-radius: 18px;
    --player-content-width: 760px;
}

/* =========================================================
   2. PAGE LAYOUT
========================================================= */

#root {
    width: 100%;
    min-height: 90vh;
    margin: 0 auto;
    padding: 32px 24px 48px;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    color: var(--player-text);
}

.workout-player {
    display: flex;
    flex-direction: column;
    gap: 18px;

    width: 100%;
    max-width: var(--player-content-width);
    min-width: 0;
    margin: 0 auto;
}

.workout-player *,
.workout-player *::before,
.workout-player *::after {
    box-sizing: border-box;
}

/* =========================================================
   3. PLAYER CARD
========================================================= */

#workout_play_card {
    display: flex;
    flex-direction: column;
    gap: 22px;

    width: 100%;
    min-width: 0;
    padding: 24px;

    border: 1px solid var(--player-border);
    border-radius: var(--player-radius);

    background: var(--player-bg);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.15);
}

/* =========================================================
   4. EXERCISE TITLE & ROUND
========================================================= */

#workout_playcard_header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;

    min-width: 0;
}

.workout-exercise-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
}

#workout_playcard_title {
    overflow-wrap: anywhere;

    color: var(--player-text);
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 780;
    line-height: 1.2;
    letter-spacing: -0.8px;
}

#workout_playcard_subtitle {
    color: var(--player-muted);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: 1.4px;
    text-transform: uppercase;
}

/* Small status indicator */

.workout-live-indicator {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-shrink: 0;

    padding: 8px 11px;

    border: 1px solid rgba(110, 231, 183, 0.18);
    border-radius: 999px;

    background: rgba(110, 231, 183, 0.07);
    color: var(--player-accent);

    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.9px;
}

.live-indicator-dot,
.media-caption-dot {
    width: 7px;
    height: 7px;
    flex-shrink: 0;

    border-radius: 50%;
    background: var(--player-accent);
}

/* =========================================================
   5. TIMER & PAUSE BUTTON
========================================================= */

#workout_playcard_content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    min-width: 0;
    padding: 22px 0;

    border-top: 1px solid var(--player-border);
    border-bottom: 1px solid var(--player-border);
}

.workout-timer {
    display: flex;
    align-items: baseline;
    gap: 9px;
    min-width: 0;
}

#timeBasedExercisesSeconds {
    color: var(--player-accent);

    font-size: clamp(48px, 8vw, 68px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -3px;

    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
}

.timer-unit {
    color: var(--player-muted);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: 1.2px;
}

#pause_btn {
    display: inline-grid;
    place-items: center;
    flex-shrink: 0;

    width: 54px;
    height: 54px;
    padding: 0;

    border: 1px solid rgba(110, 231, 183, 0.22);
    border-radius: 16px;

    background: rgba(110, 231, 183, 0.09);
    color: var(--player-accent);

    cursor: pointer;

    transition:
        transform 160ms ease,
        background 160ms ease,
        border-color 160ms ease;
}

#pause_btn svg {
    display: block;
    width: 23px;
    height: 23px;
}

#pause_btn:hover {
    border-color: rgba(110, 231, 183, 0.45);
    background: rgba(110, 231, 183, 0.16);
}

#pause_btn:active {
    transform: scale(0.96);
}

#pause_btn:focus-visible,
#volume_slider:focus-visible {
    outline: 2px solid var(--player-accent);
    outline-offset: 4px;
}

/* =========================================================
   6. VOLUME CONTROL
========================================================= */

#volume_control {
    display: flex;
    align-items: center;
    gap: 12px;

    width: 100%;
    max-width: 300px;
    min-width: 0;

    color: var(--player-secondary);
}

#volume_control > svg {
    display: block;
    flex-shrink: 0;
    width: 21px;
    height: 21px;
}

#volume_slider {
    width: 100%;
    min-width: 0;
    height: 5px;
    margin: 0;

    border-radius: 999px;
    accent-color: var(--player-accent);

    cursor: pointer;
}

.volume-value {
    min-width: 36px;

    color: var(--player-muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: right;
}

/* =========================================================
   7. OVERALL SESSION PROGRESS
========================================================= */

#session-duration-progress {
    display: flex;
    flex-direction: column;
    gap: 12px;

    width: 100%;
    min-width: 0;
}

.session-progress-labels {
    display: flex;
    align-items: center;
    gap: 9px;

    color: var(--player-muted);
    font-size: 12px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
}

#session-time-elapsed {
    color: var(--player-text);
}

#session-total-duration {
    color: var(--player-secondary);
}

.session-progress-separator {
    color: #536074;
}

.session-progress-labels > svg {
    width: 17px;
    height: 17px;
    margin-left: auto;
    flex-shrink: 0;

    color: var(--player-muted);
}

#session-progress-track {
    overflow: hidden;

    width: 100%;
    height: 5px;

    border-radius: 999px;
    background: #293446;
}

#session-progress-bar {
    width: 1%;
    height: 100%;

    border-radius: inherit;
    background: var(--player-accent);

    transition: width 250ms linear;
}

/* =========================================================
   8. EXERCISE IMAGE / GIF
========================================================= */

#workout_playcard_img {
    width: 100%;
    min-width: 0;
}

.exercise-media-frame {
    position: relative;
    overflow: hidden;

    width: 100%;
    min-width: 0;

    border: 1px solid var(--player-border);
    border-radius: var(--player-radius);

    background:
        radial-gradient(
            ellipse at center,
            rgba(110, 231, 183, 0.045),
            transparent 65%
        ),
        #101827;

    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
}

/*
   A consistent landscape media area.
   Images retain their proportions and GIFs animate normally.
*/

#workout_exercise_image {
    display: block;

    width: 100%;
    aspect-ratio: 16 / 10;
    height: auto;

    object-fit: contain;
    object-position: center;

    padding: 12px;

    color: var(--player-secondary);
    font-size: 13px;
}

/* Image label */

.exercise-media-caption {
    position: absolute;
    left: 14px;
    bottom: 14px;

    display: inline-flex;
    align-items: center;
    gap: 8px;

    max-width: calc(100% - 28px);
    padding: 8px 11px;

    border: 1px solid rgba(148, 163, 184, 0.13);
    border-radius: 8px;

    background: rgba(11, 18, 32, 0.86);
    color: var(--player-secondary);

    font-size: 9px;
    font-weight: 750;
    letter-spacing: 1px;

    backdrop-filter: blur(8px);
}

.exercise-media-caption span:last-child {
    overflow-wrap: anywhere;
}

/* =========================================================
   9. ACCESSIBILITY
========================================================= */

.sr-only {
    position: absolute;

    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;

    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;

    border: 0;
}

/* =========================================================
   10. TABLET
========================================================= */

@media (max-width: 800px) {
    #root {
        padding: 26px 18px 36px;
    }

    .workout-player {
        gap: 16px;
    }

    #workout_play_card {
        padding: 22px;
        gap: 20px;
    }
}

/* =========================================================
   11. MOBILE
========================================================= */

@media (max-width: 520px) {
    #root {
        min-height: auto;
        padding: 18px 12px 28px;
    }

    .workout-player {
        gap: 12px;
    }

    #workout_play_card {
        gap: 18px;
        padding: 17px;
        border-radius: 15px;
    }

    #workout_playcard_header {
        align-items: flex-start;
        gap: 10px;
    }

    #workout_playcard_title {
        font-size: 23px;
        letter-spacing: -0.5px;
    }

    #workout_playcard_subtitle {
        font-size: 10px;
        letter-spacing: 1px;
    }

    .workout-live-indicator {
        gap: 6px;
        padding: 7px 9px;
        font-size: 9px;
    }

    .live-indicator-dot {
        width: 6px;
        height: 6px;
    }

    #workout_playcard_content {
        padding: 20px 0;
    }

    #timeBasedExercisesSeconds {
        font-size: clamp(48px, 13vw, 60px);
        letter-spacing: -2px;
    }

    #pause_btn {
        width: 50px;
        height: 50px;
        border-radius: 14px;
    }

    #volume_control {
        max-width: none;
    }

    .session-progress-labels {
        font-size: 11px;
    }

    .exercise-media-frame {
        border-radius: 14px;
    }

    #workout_exercise_image {
        aspect-ratio: 4 / 3;
        padding: 8px;
    }

    .exercise-media-caption {
        left: 10px;
        bottom: 10px;
        padding: 7px 9px;
        font-size: 8px;
        letter-spacing: 0.7px;
    }
}

/* =========================================================
   12. SMALL MOBILE
========================================================= */

@media (max-width: 360px) {
    #root {
        padding: 14px 8px 22px;
    }

    #workout_play_card {
        padding: 14px;
    }

    .workout-live-indicator {
        padding: 6px 7px;
        font-size: 8px;
    }

    #workout_playcard_title {
        font-size: 21px;
    }

    #pause_btn {
        width: 46px;
        height: 46px;
    }

    .session-progress-labels {
        gap: 6px;
    }
}

/* =========================================================
   13. REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}

</style>
</head>

<body>
<div id="root">
    <main class="workout-player">

        <!-- Workout timer and controls -->
        <section id="workout_play_card" class="play_styling">

            <div id="workout_playcard_header">

                <div class="workout-exercise-info">
                    <div id="workout_playcard_title">1-Step</div>
                    <div id="workout_playcard_subtitle">ROUND 1 / 9</div>
                </div>

                <div class="workout-live-indicator">
                    <span class="live-indicator-dot"></span>
                    <span>WORKOUT</span>
                </div>

            </div>

            <div id="workout_playcard_content">

                <div class="workout-timer" aria-live="off">
                    <span id="timeBasedExercisesSeconds">21</span>
                    <span class="timer-unit">SEC</span>
                </div>

                <button
                    type="button"
                    id="pause_btn"
                    class="player-control-btn"
                    onclick="toggleWorkoutPause()"
                    aria-label="Pause workout"
                    title="Pause or resume workout"
                    aria-pressed="false"
                >
                    <!-- Default icon: pause -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <rect x="6" y="4" width="4" height="16" rx="1"/>
                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                    </svg>
                </button>

            </div>

            <!-- Volume -->
            <div id="volume_control">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                    <path d="M19 5a10 10 0 0 1 0 14"/>
                </svg>

                <label for="volume_slider" class="sr-only">
                    Workout volume
                </label>

                <input
                    type="range"
                    id="volume_slider"
                    min="0"
                    max="1"
                    step="0.05"
                    value="1"
                    oninput="setVolume(this.value)"
                    aria-label="Workout volume"
                />

                <span id="volume_value" class="volume-value">100%</span>

            </div>

            <!-- Overall session progress -->
            <div id="session-duration-progress">

                <div class="session-progress-labels">
                    <span id="session-time-elapsed">0' 04"</span>

                    <span class="session-progress-separator">/</span>

                    <span id="session-total-duration">6' 45"</span>

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>

                <div
                    id="session-progress-track"
                    role="progressbar"
                    aria-label="Workout session progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="1"
                >
                    <div id="session-progress-bar"></div>
                </div>

            </div>

        </section>

        <!-- Exercise demonstration: static image or animated GIF -->
        <section id="workout_playcard_img" aria-label="Exercise demonstration">

            <div class="exercise-media-frame">

                <img
                    id="workout_exercise_image"
                    src="../images/move.png"
                    alt="Demonstration of the 1-Step breaking footwork movement"
                />

                <div class="exercise-media-caption">
                    <span class="media-caption-dot"></span>
                    <span>EXERCISE DEMONSTRATION</span>
                </div>

            </div>

        </section>

    </main>
</div>

<script>
    // Update the volume percentage label.
    // Keep your existing setVolume(value) function.
    $("#volume_slider").on("input", function () {
        $("#volume_value").text(Math.round(Number(this.value) * 100) + "%");
    });

    /*
      Optional integration helpers:

      Update the exercise demonstration:
      $("#workout_exercise_image").attr({
          src: "../images/your-exercise.gif",
          alt: "Demonstration of your exercise"
      });

      Update session progress:
      const percent = Math.min(100, Math.max(0, elapsedSeconds / totalSeconds * 100));
      $("#session-progress-bar").css("width", percent + "%");
      $("#session-progress-track").attr("aria-valuenow", Math.round(percent));

      If your existing timer code already updates the time, connect the
      progress bar to that same timer rather than creating a second timer.
    */
</script>

</body>
</html>
