<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Programme Builder Screen</title>

    <!-- Demo dependencies. Remove duplicates if already included in your app. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>


<style>

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(110, 231, 183, 0.09),
                    transparent 45%
                ),
                linear-gradient(180deg, #0b1220 0%, #101827 100%);
            background-color: var(--app-bg);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--main-font-color);
            font-family: var(--main-font-family);
            font-size: var(--main-font-size);
            line-height: 1.5;
            background: transparent;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
		
		
/* ==========================================
   PRACTICE BUILDER
   Dark theme + muted mint accent
========================================== */

#programme_workout_builder_wrapper {
    --pb-bg: #0b1220;
    --pb-panel: rgba(18, 25, 37, 0.94);
    --pb-raised: #192231;
    --pb-hover: #202b3b;
    --pb-border: rgba(148, 163, 184, 0.14);
    --pb-border-hover: rgba(148, 163, 184, 0.28);
    --pb-text: #e5eaf1;
    --pb-secondary: #a0acbc;
    --pb-muted: #778498;
    --pb-accent: #6ee7b7;
    --pb-accent-hover: #8af0c8;
    --pb-danger: #fda4af;

    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 22px 48px;

    color: var(--pb-text);
    font-family: var(--main-font-family, inherit);
    font-size: var(--main-font-size, 16px);
    box-sizing: border-box;
}

#programme_workout_builder_wrapper *,
#programme_workout_builder_wrapper *::before,
#programme_workout_builder_wrapper *::after {
    box-sizing: border-box;
}

/* ==========================================
   SETTINGS PANEL
========================================== */

#programme_workout_settings {
    width: 100%;
    margin-bottom: 24px;
}

#programme_workout_settings .programme_settings {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
        "title count"
        "info count"
        "actions actions";

    align-items: center;
    gap: 12px 24px;

    padding: 28px 30px;

    background: var(--pb-panel);
    border: 1px solid var(--pb-border);
    border-radius: 20px;

    box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

/* Heading */

#programme_workout_builder_wrapper .programme_title_wrapper {
    grid-area: title;
    min-width: 0;
}

#programme_workout_builder_wrapper .programme_title_wrapper h2 {
    position: relative;
    margin: 0;
    padding-bottom: 15px;

    color: var(--pb-text);
    font-size: clamp(1.6rem, 3vw, 2rem);
    font-weight: 750;
    line-height: 1.2;
    letter-spacing: -0.045em;
}

#programme_workout_builder_wrapper .programme_title_wrapper h2::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;

    width: 44px;
    height: 3px;
    border-radius: 99px;

    background: var(--pb-accent);
    box-shadow: 0 0 14px rgba(110, 231, 183, 0.18);
}

/* Description */

#programme_workout_builder_wrapper .programme_info {
    grid-area: info;
    min-width: 0;
    max-width: 560px;

    color: var(--pb-secondary);
    font-size: 0.9rem;
    line-height: 1.7;
}

/* Exercise count */

#programme_workout_builder_wrapper .programme_total_count_box {
    grid-area: count;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    min-width: 135px;
    padding: 16px 20px;

    background: rgba(110, 231, 183, 0.065);
    border: 1px solid rgba(110, 231, 183, 0.18);
    border-radius: 14px;

    color: var(--pb-secondary);
    font-size: 0.85rem;
    font-weight: 600;
}

#programme_workout_builder_wrapper #programme_total_count {
    color: var(--pb-accent);
    font-size: 1.7rem;
    font-weight: 750;
    line-height: 1;
    font-variant-numeric: tabular-nums;
}

/* Save / Load */

#programme_workout_builder_wrapper .programme_state_buttons {
    grid-area: actions;

    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;

    padding-top: 18px;
    border-top: 1px solid var(--pb-border);
}

#programme_workout_builder_wrapper .programme_state_buttons .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 100px;
    min-height: 40px;
    padding: 9px 17px;

    border: 1px solid var(--pb-border);
    border-radius: 10px;

    font: inherit;
    font-size: 0.85rem;
    font-weight: 650;

    cursor: pointer;

    transition:
        background 160ms ease,
        border-color 160ms ease,
        color 160ms ease,
        transform 160ms ease;
}

#programme_workout_builder_wrapper #programme_save_state_btn {
    background: var(--pb-accent);
    border-color: transparent;
    color: #092019;
}

#programme_workout_builder_wrapper #programme_save_state_btn:hover {
    background: var(--pb-accent-hover);
    transform: translateY(-1px);
}

#programme_workout_builder_wrapper .programme_load_state_btn {
    background: var(--pb-raised);
    color: var(--pb-text);
}

#programme_workout_builder_wrapper .programme_load_state_btn:hover {
    background: var(--pb-hover);
    border-color: var(--pb-border-hover);
}

/* ==========================================
   EXERCISE LIST
========================================== */

#programme_moves_selection {
    display: flex;
    flex-direction: column;
    gap: 12px;

    width: 100%;
    min-width: 0;
}

/* Each exercise row */

#programme_workout_builder_wrapper .programme_move_label {
    display: grid;
    grid-template-columns:
        28px
        minmax(190px, 1.35fr)
        112px
        minmax(150px, 1fr)
        40px;
    align-items: center;
    gap: 12px;

    width: 100%;
    min-width: 0;
    padding: 16px;

    background: var(--pb-panel);
    border: 1px solid var(--pb-border);
    border-radius: 15px;

    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);

    transition:
        border-color 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
}

#programme_workout_builder_wrapper .programme_move_label:hover {
    border-color: var(--pb-border-hover);
    background: rgba(22, 31, 45, 0.98);
}

/* Optional class used by drag/drop scripts */

#programme_workout_builder_wrapper .programme_move_label.sortable-ghost {
    opacity: 0.35;
    border: 1px dashed var(--pb-accent);
}

#programme_workout_builder_wrapper .programme_move_label.sortable-chosen {
    border-color: rgba(110, 231, 183, 0.45);
}

#programme_workout_builder_wrapper .programme_move_label.sortable-drag {
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
}

/* ==========================================
   DRAG HANDLE
========================================== */

#programme_workout_builder_wrapper .programme_drag_handle {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 28px;
    min-height: 42px;

    border-radius: 8px;
    color: var(--pb-muted);

    font-size: 1.1rem;
    letter-spacing: -3px;
    cursor: grab;
    user-select: none;

    transition:
        color 160ms ease,
        background 160ms ease;
}

#programme_workout_builder_wrapper .programme_drag_handle:hover {
    color: var(--pb-accent);
    background: rgba(110, 231, 183, 0.07);
}

#programme_workout_builder_wrapper .programme_drag_handle:active {
    cursor: grabbing;
}

/* ==========================================
   EXERCISE SELECT
========================================== */

#programme_workout_builder_wrapper .programme_select {
    min-width: 0;
    width: 100%;
}

#programme_workout_builder_wrapper .programme_move_dropdown {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 10px 34px 10px 12px;

    appearance: auto;
    -webkit-appearance: auto;

    border: 1px solid var(--pb-border);
    border-radius: 9px;
    outline: none;

    background-color: #0d1522;
    color: var(--pb-text);

    font-family: inherit;
    font-size: 0.85rem;
    line-height: 1.4;

    cursor: pointer;

    transition:
        border-color 160ms ease,
        box-shadow 160ms ease;
}

#programme_workout_builder_wrapper .programme_move_dropdown:hover {
    border-color: var(--pb-border-hover);
}

#programme_workout_builder_wrapper .programme_move_dropdown:focus {
    border-color: rgba(110, 231, 183, 0.7);
    box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.09);
}

#programme_workout_builder_wrapper .programme_move_dropdown option,
#programme_workout_builder_wrapper .programme_move_dropdown optgroup {
    background: #111a29;
    color: var(--pb-text);
}

/* ==========================================
   REPETITION COUNTER
========================================== */

#programme_workout_builder_wrapper .programme_counter {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;

    min-width: 0;
    min-height: 44px;
    padding: 4px;

    background: #0d1522;
    border: 1px solid var(--pb-border);
    border-radius: 10px;
}

#programme_workout_builder_wrapper .programme_counter button {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 30px;

    width: 30px;
    height: 32px;
    padding: 0;

    border: 1px solid transparent;
    border-radius: 7px;

    background: var(--pb-raised);
    color: var(--pb-text);

    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1;

    cursor: pointer;

    transition:
        background 150ms ease,
        color 150ms ease,
        border-color 150ms ease;
}

#programme_workout_builder_wrapper .programme_counter button:hover {
    background: rgba(110, 231, 183, 0.12);
    border-color: rgba(110, 231, 183, 0.2);
    color: var(--pb-accent);
}

#programme_workout_builder_wrapper .programme_move_count {
    flex: 1 1 auto;
    min-width: 14px;

    color: var(--pb-text);
    font-size: 0.9rem;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
}

/* ==========================================
   COMMENT FIELD
========================================== */

#programme_workout_builder_wrapper .programme_move_comment {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 10px 12px;

    border: 1px solid var(--pb-border);
    border-radius: 9px;
    outline: none;

    background: #0d1522;
    color: var(--pb-text);

    font-family: inherit;
    font-size: 0.84rem;

    transition:
        border-color 160ms ease,
        box-shadow 160ms ease;
}

#programme_workout_builder_wrapper .programme_move_comment::placeholder {
    color: var(--pb-muted);
    opacity: 0.9;
}

#programme_workout_builder_wrapper .programme_move_comment:hover {
    border-color: var(--pb-border-hover);
}

#programme_workout_builder_wrapper .programme_move_comment:focus {
    border-color: rgba(110, 231, 183, 0.7);
    box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.09);
}

/* ==========================================
   REMOVE EXERCISE
========================================== */

#programme_workout_builder_wrapper .programme_remove_btn {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 40px;
    height: 42px;
    padding: 0;

    border: 1px solid transparent;
    border-radius: 9px;

    background: rgba(251, 113, 133, 0.07);
    color: var(--pb-danger);

    font-size: 1rem;
    cursor: pointer;

    transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
}

#programme_workout_builder_wrapper .programme_remove_btn:hover {
    background: rgba(251, 113, 133, 0.15);
    border-color: rgba(251, 113, 133, 0.24);
    transform: translateY(-1px);
}

/* ==========================================
   BOTTOM ACTIONS
========================================== */

#programme_form_buttons {
    width: 100%;
    margin-top: 22px;
}

#programme_workout_builder_wrapper #programme_form_buttons .form_buttons {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;

    padding: 18px;

    background: rgba(18, 25, 37, 0.72);
    border: 1px solid var(--pb-border);
    border-radius: 15px;
}

/* General button styles scoped to this screen */

#programme_workout_builder_wrapper #programme_form_buttons .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    min-height: 48px;
    padding: 12px 20px;

    border: 1px solid var(--pb-border);
    border-radius: 10px;

    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.3;

    cursor: pointer;

    transition:
        background 160ms ease,
        border-color 160ms ease,
        color 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
}

/* Add Exercise */

#programme_workout_builder_wrapper #programme_form_buttons .add_programme_move {
    background: var(--pb-raised);
    border-color: var(--pb-border-hover);
    color: var(--pb-text);
}

#programme_workout_builder_wrapper #programme_form_buttons .add_programme_move:hover {
    background: var(--pb-hover);
    border-color: rgba(110, 231, 183, 0.35);
    color: var(--pb-accent);
    transform: translateY(-1px);
}

/* Start Practice */

#programme_workout_builder_wrapper #programme_form_buttons .start_programme_session {
    flex: 1 1 220px;

    background: var(--pb-accent);
    border-color: transparent;
    color: #092019;

    box-shadow: 0 5px 18px rgba(110, 231, 183, 0.07);
}

#programme_workout_builder_wrapper #programme_form_buttons .start_programme_session:hover {
    background: var(--pb-accent-hover);
    box-shadow: 0 7px 22px rgba(110, 231, 183, 0.14);
    transform: translateY(-1px);
}

/* ==========================================
   ACCESSIBILITY
========================================== */

#programme_workout_builder_wrapper button:focus-visible,
#programme_workout_builder_wrapper select:focus-visible,
#programme_workout_builder_wrapper input:focus-visible {
    outline: 2px solid var(--pb-accent);
    outline-offset: 3px;
}

/* ==========================================
   TABLET
========================================== */

@media (max-width: 850px) {
    #programme_workout_builder_wrapper {
        padding: 26px 18px 40px;
    }

    #programme_workout_settings .programme_settings {
        padding: 24px;
        gap: 12px 18px;
    }

    #programme_workout_builder_wrapper .programme_move_label {
        grid-template-columns:
            24px
            minmax(160px, 1fr)
            108px
            38px;
        gap: 10px;
    }

    #programme_workout_builder_wrapper .programme_drag_handle {
        width: 24px;
    }

    #programme_workout_builder_wrapper .programme_move_comment {
        grid-column: 2 / 4;
        grid-row: 2;
    }

    #programme_workout_builder_wrapper .programme_remove_btn {
        grid-column: 4;
        grid-row: 1;
        justify-self: end;
    }

    #programme_workout_builder_wrapper .programme_move_dropdown {
        font-size: 0.82rem;
    }
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 560px) {
    #programme_workout_builder_wrapper {
        padding: 18px 12px 30px;
    }

    #programme_workout_settings .programme_settings {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
            "title title"
            "info info"
            "count count"
            "actions actions";

        gap: 16px;
        padding: 22px 18px;
        border-radius: 17px;
    }

    #programme_workout_builder_wrapper .programme_title_wrapper h2 {
        font-size: 1.65rem;
    }

    #programme_workout_builder_wrapper .programme_info {
        font-size: 0.86rem;
    }

    #programme_workout_builder_wrapper .programme_total_count_box {
        justify-content: space-between;
        min-width: 0;
        padding: 12px 15px;
    }

    #programme_workout_builder_wrapper #programme_total_count {
        font-size: 1.45rem;
    }

    #programme_workout_builder_wrapper .programme_state_buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        padding-top: 16px;
    }

    #programme_workout_builder_wrapper .programme_state_buttons .btn {
        width: 100%;
        min-width: 0;
    }

    #programme_moves_selection {
        gap: 12px;
    }

    #programme_workout_builder_wrapper .programme_move_label {
        grid-template-columns: 26px minmax(0, 1fr) 42px;
        grid-template-areas:
            "drag select remove"
            "drag counter counter"
            "comment comment comment";

        gap: 10px;
        padding: 13px;
        border-radius: 13px;
    }

    #programme_workout_builder_wrapper .programme_drag_handle {
        grid-area: drag;
        align-self: stretch;
        width: 26px;
        min-height: 44px;
    }

    #programme_workout_builder_wrapper .programme_select {
        grid-area: select;
    }

    #programme_workout_builder_wrapper .programme_move_dropdown {
        min-height: 46px;
        font-size: 0.84rem;
    }

    #programme_workout_builder_wrapper .programme_counter {
        grid-area: counter;
        justify-content: flex-start;
        width: 100%;
        min-height: 42px;
        gap: 12px;
        padding: 4px;
    }

    #programme_workout_builder_wrapper .programme_counter button {
        flex-basis: 34px;
        width: 34px;
        height: 32px;
    }

    #programme_workout_builder_wrapper .programme_move_count {
        flex: 0 0 28px;
        font-size: 0.95rem;
    }

    #programme_workout_builder_wrapper .programme_move_comment {
        grid-area: comment;
        min-height: 43px;
    }

    #programme_workout_builder_wrapper .programme_remove_btn {
        grid-area: remove;
        grid-column: auto;
        grid-row: auto;
        justify-self: stretch;

        width: 42px;
        height: 44px;
    }

    #programme_workout_builder_wrapper #programme_form_buttons {
        margin-top: 18px;
    }

    #programme_workout_builder_wrapper #programme_form_buttons .form_buttons {
        flex-direction: column;
        padding: 13px;
        gap: 10px;
    }

    #programme_workout_builder_wrapper #programme_form_buttons .btn {
        width: 100%;
        min-height: 48px;
    }

    #programme_workout_builder_wrapper #programme_form_buttons .start_programme_session {
        flex-basis: auto;
        order: -1;
    }
}

/* Very narrow devices */

@media (max-width: 360px) {
    #programme_workout_builder_wrapper {
        padding-right: 8px;
        padding-left: 8px;
    }

    #programme_workout_settings .programme_settings {
        padding: 18px 14px;
    }

    #programme_workout_builder_wrapper .programme_move_label {
        gap: 8px;
        padding: 10px;
    }

    #programme_workout_builder_wrapper #programme_form_buttons .btn {
        padding: 11px 14px;
        font-size: 0.85rem;
    }
}

/* Reduced motion */

@media (prefers-reduced-motion: reduce) {
    #programme_workout_builder_wrapper *,
    #programme_workout_builder_wrapper *::before,
    #programme_workout_builder_wrapper *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

		
		
</style>
</head>
<body>
<div id="programme_workout_builder_wrapper">
      <div id="programme_workout_settings">
    <div id="programme_settings" class="programme_settings">
      <div class="programme_title_wrapper">
        <h2>Practice Builder</h2>
      </div>
      <div class="programme_info">
        <span>Build a practice checklist workout, drag to reorder, and save it like a normal session.</span>
      </div>
      <div class="programme_total_count_box">
        <span>Exercises:</span>
        <strong id="programme_total_count">0</strong>
      </div>
      <div class="programme_state_buttons">
        <button id="programme_save_state_btn" class="btn btn-primary btn-sm" type="button" onclick="newProgrammeStatePopup('save')">Save</button>
        <button class="programme_load_state_btn btn btn-secondary btn-sm" type="button" onclick="newProgrammeStatePopup('load')">Load</button>
      </div>
    </div>
  </div>
      <div id="programme_moves_selection">
    <div class="programme_move_label noselection">
      <div class="programme_drag_handle drag-handle" title="Drag to reorder">⋮⋮</div>
      <div class="programme_select">

<script>
    let programmeSortable = null;

    function initProgrammeSortable() {
        const container = document.getElementById("programme_moves_selection");

        if (!container || typeof Sortable === "undefined") {
            return;
        }

        // Destroy the previous instance before reinitializing.
        if (programmeSortable) {
            programmeSortable.destroy();
            programmeSortable = null;
        }

        programmeSortable = new Sortable(container, {
            handle: ".drag-handle",
            animation: 160,
            ghostClass: "sortable-ghost",
            chosenClass: "sortable-chosen",

            onEnd: function () {
                updateWorkoutSettings(
                    calculateTotalExerciseCount(),
                    calculateTotalWorkoutDuration()
                );
            }
        });
    }

    // Initialize when the page is ready.
    document.addEventListener("DOMContentLoaded", function () {
        initProgrammeSortable();
    });
</script>
